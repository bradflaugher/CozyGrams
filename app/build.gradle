plugins { id 'com.android.application' }

android {
    namespace 'com.cozygrams.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cozygrams.tv'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildTypes {
        release {
            // Produces an immediately sideloadable APK. Replace with a protected
            // persistent keystore before Play Store or long-term distribution.
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
