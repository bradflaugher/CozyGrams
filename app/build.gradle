plugins { id 'com.android.application' }

android {
    namespace 'com.cozygrams.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cozygrams.tv'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '2.0.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    signingConfigs {
        release {
            storeFile file('keystore/cozygrams-release.jks')
            storePassword 'cozygrams-release'
            keyAlias 'cozygrams'
            keyPassword 'cozygrams-release'
        }
    }
    buildTypes {
        release {
            // Stable project signing makes every GitHub APK an in-place upgrade.
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
