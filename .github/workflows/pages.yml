name: Pages

# The website in site/ (landing page, privacy policy, 404) is plain HTML with
# no build step. Pull requests that touch it are checked; pushes to main
# deploy it to GitHub Pages at https://bradflaugher.github.io/CozyGrams/.
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/scripts/check_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/scripts/check_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, but a
# deployment already under way is allowed to finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links, assets and the privacy policy
        run: python3 .github/scripts/check_site.py

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the uploaded site
      id-token: write # prove to Pages that this run is the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
