name: Latest APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-apk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test lint assembleRelease --stacktrace
      - name: Publish sideloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CozyGrams-latest.apk
          sha256sum CozyGrams-latest.apk > CozyGrams-latest.apk.sha256
          RELEASE_TAG="v$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          gh release create "$RELEASE_TAG" CozyGrams-latest.apk CozyGrams-latest.apk.sha256 --target "$GITHUB_SHA" --latest --generate-notes --title "CozyGrams $RELEASE_TAG"
          gh release list --limit 100 --json tagName --jq ".[] | select(.tagName != \"$RELEASE_TAG\") | .tagName" \
            | xargs -r -n1 gh release delete --yes
