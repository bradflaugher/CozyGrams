name: Latest APK Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test lint assembleRelease --stacktrace
      - name: Keep only the latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --limit 100 --json tagName --jq '.[].tagName' | xargs -r -n1 gh release delete --yes
      - name: Publish sideloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CozyGrams-latest.apk
          sha256sum CozyGrams-latest.apk > CozyGrams-latest.apk.sha256
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            VERSION_NAME=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*versionName '([^']+)'.*/\1/")
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          gh release create "$RELEASE_TAG" CozyGrams-latest.apk CozyGrams-latest.apk.sha256 --target "$GITHUB_SHA" --latest --generate-notes --title "CozyGrams $RELEASE_TAG"
