name: Latest APK Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test lint assembleRelease --stacktrace
      - name: Keep only the latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --limit 100 --json tagName --jq '.[].tagName' | xargs -r -n1 gh release delete --yes
      - name: Publish sideloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CozyGrams-latest.apk
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then RELEASE_TAG="$GITHUB_REF_NAME"; else RELEASE_TAG="v1.0.${GITHUB_RUN_NUMBER}"; fi
          gh release create "$RELEASE_TAG" CozyGrams-latest.apk --target "$GITHUB_SHA" --latest --generate-notes --title "CozyGrams $RELEASE_TAG"
