version: 2
updates:
  # Every version update waits 3 days after a release before Dependabot
  # proposes it, so a hijacked release has time to be pulled first. Security
  # updates ignore the cooldown.

  # The Android Gradle plugin in build.gradle (the app has no libraries).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps land together in one PR. Major versions still
      # arrive one per PR, so their release notes get a look.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Actions are pinned to commit SHAs; Dependabot keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      # All action pin bumps in one PR: they are SHA-pinned and CI runs on
      # every one of them.
      actions:
        patterns:
          - "*"
